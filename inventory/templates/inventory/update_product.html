{% extends "base.html" %}

{% block content %}
<main>
    <section class="card">
        <h2>Editar produto</h2>

        <p class="description">
            Atualize as informações do produto no seu estoque.
        </p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Salvar alterações</button>
        </form>
    </section>
</main>
{% endblock content %}
